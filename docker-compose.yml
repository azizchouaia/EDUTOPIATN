services:
  app:
    build:
      context: .
      target: backend-runtime
    image: edutopia-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - uploads_data:/app/backend/uploads
    expose:
      - "5000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      target: frontend-runtime
      args:
        VITE_API_URL: "/api"
    image: edutopia-frontend:latest
    restart: unless-stopped
    expose:
      - "8787"
    depends_on:
      - app
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto-runs once on first boot (empty data dir) — remove after first deploy
      # if you don't want re-seeding on volume reset.
      - ./database.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "3306"          # internal only — never published to the host

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  mysql_data:
  uploads_data:
  caddy_data:
  caddy_config:
