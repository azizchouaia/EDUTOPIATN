# Nginx config for Edutopia — reverse proxy + static file serving
#
# Tested with nginx 1.18+.
# Place this file at:
#   /etc/nginx/sites-available/edutopia.conf
# Then enable it:
#   sudo ln -s /etc/nginx/sites-available/edutopia.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace:
#   yourdomain.com         → your actual domain (or server IP during testing)
#   /var/www/edutopia      → absolute path to the built frontend (dist/)
#   /var/www/edutopia-api  → absolute path to the backend root (where uploads/ lives)

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
# Uncomment once you have an SSL certificate (e.g. via certbot).
#
# server {
#   listen 80;
#   server_name yourdomain.com www.yourdomain.com;
#   return 301 https://$host$request_uri;
# }

# ── Main server block ─────────────────────────────────────────────────────────
server {
  listen 80;
  # listen 443 ssl http2;   # uncomment for HTTPS
  server_name yourdomain.com www.yourdomain.com;

  # ── SSL (uncomment after running certbot) ──────────────────────────────────
  # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
  # ssl_protocols       TLSv1.2 TLSv1.3;
  # ssl_prefer_server_ciphers on;

  # ── Gzip compression ───────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;

  # ── Client upload limit (must match multer limits) ─────────────────────────
  client_max_body_size 50M;

  # ── Static uploads — served directly by nginx, bypassing Node ─────────────
  # This is the biggest win: large PDF/MP4 files never touch Node at all.
  location /uploads/ {
    alias /var/www/edutopia-api/uploads/;
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
    # Allow cross-origin embedding (needed for frontend iframe resource viewer)
    add_header Access-Control-Allow-Origin "*";
    add_header Content-Security-Policy "frame-ancestors *";
  }

  # ── API — proxy to PM2 cluster ─────────────────────────────────────────────
  location /api/ {
    proxy_pass         http://127.0.0.1:5000;
    proxy_http_version 1.1;

    # Required for keep-alive connections (reduces handshake overhead)
    proxy_set_header   Connection        "";

    # Forward real client info so rate-limit and logging work correctly
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Timeouts: generous for file uploads, tight for normal JSON endpoints
    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;  # allow up to 2 min for large uploads
    proxy_send_timeout    30s;

    # Buffer upstream responses so slow clients don't hold Node connections
    proxy_buffering    on;
    proxy_buffer_size  16k;
    proxy_buffers      8 16k;
  }

  # ── Frontend — serve Vite build as static HTML ────────────────────────────
  root /var/www/edutopia;
  index index.html;

  location / {
    # Cache hashed asset files for 1 year (Vite fingerprints them)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # HTML itself: no cache (so new deploys are picked up immediately)
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # ── Security headers (supplement helmet on the Node side) ─────────────────
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
