<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecd9a0"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#b8912a"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="64" height="64" rx="14" fill="#14090d"/>

  <!-- Open gold circle (swoosh) -->
  <path d="M 46.5 18.5 A 18.5 18.5 0 1 0 51 30" fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Sparkle star -->
  <path d="M 50 10 L 51.2 14.8 L 56 16 L 51.2 17.2 L 50 22 L 48.8 17.2 L 44 16 L 48.8 14.8 Z" fill="url(#gold)"/>

  <!-- ET monogram -->
  <text x="32" y="38.5" text-anchor="middle" font-family="Playfair Display, Georgia, 'Times New Roman', serif" font-size="23" font-weight="600" letter-spacing="0.5" fill="url(#gold)">ET</text>

  <!-- Wordmark -->
  <text x="32" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="5.4" letter-spacing="1.7" fill="#d4af37">EDUTOPIA</text>
</svg>
